name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run checks (Astro, TypeScript, Figures, Answers, Copy, Consent Hash, Installers, Legal)
        run: npm run check

      - name: Run unit tests (Site + API)
        run: npm run test

      - name: Build Site and API
        run: npm run build
