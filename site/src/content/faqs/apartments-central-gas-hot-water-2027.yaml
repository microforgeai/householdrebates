question: How does Victoria’s 2027 gas hot water rule apply to apartments on centralised gas?
answer: Regulation 45E(3) exempts Class 2 apartment buildings served by a centralised gas hot water system from the 1 March 2027 mains gas water heater replacement restriction. Rental minimum standards also include exemptions where centralised systems, lack of external compressor space, or owners-corporation rules prevent an individual electric installation—see [Victoria 2027 gas hot water rule exemptions](/victoria/gas-hot-water-ban-exemptions/).
