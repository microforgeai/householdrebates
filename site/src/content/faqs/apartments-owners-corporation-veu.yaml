question: Can apartment owners and owners corporations access VEU discounts?
answer: Yes. Energy Victoria confirms that owners corporations are eligible for
  Victorian Energy Upgrades either under residential activities (for Class 1, 2,
  3, or 4 buildings) or commercial activities depending on building
  classification, and individual lot owners can also upgrade lot-specific
  appliances where owners-corporation rules allow.
