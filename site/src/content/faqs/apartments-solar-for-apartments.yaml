question: How does Solar Victoria’s Solar for Apartments program work?
answer: Solar Victoria’s Solar for Apartments program helps owners corporations
  install shared solar PV across multi-unit residential buildings, running until
  30 June 2027 or until funding is exhausted. Because Solar Victoria announced a
  program expansion removing the median property value cap and raising the lot
  threshold while updating its main program page, check Solar Victoria’s Solar
  for Apartments page directly for current lot rules.
