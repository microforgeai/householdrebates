question: "Who reviews technical pages on Household Rebates?"
answer: "All guides and fact-checks are edited by Gurinder Singh against primary Victorian and federal publications. A separate technical review line appears on a page only when a licensed practitioner has signed a written review agreement, showing their name, licence number, review date, and whether they are also a participating installer."
