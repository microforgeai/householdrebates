question: What is the City of Ballarat Electrify Your Home initiative?
answer: The City of Ballarat launched the Electrify Your Home initiative in
  partnership with Geelong Sustainability’s Electric Homes Program to connect
  residents with vetted home electrification advice and upgrades. Check the City
  of Ballarat link in our sources section for current program intake details.
