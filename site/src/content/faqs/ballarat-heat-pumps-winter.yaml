question: Do heat pump hot water systems work reliably in Ballarat winters?
answer: Ballarat postcodes sit in VEU heat pump climatic zone 5 and NCC climate
  zone 7 (cool temperate). Energy Victoria advises households in cooler climates
  to choose a heat pump water heater with frost protection, and your accredited
  provider or plumber can match cold-climate recovery performance to your
  household size.
