question: Is Ballarat classified as regional and cold for VEU ceiling insulation
  discounts?
answer: Yes. In VEU Specifications version 25 Location Variable List (Table A),
  all 8 Ballarat council postcodes (3350 and 3352–3358) are classified as
  Regional with a Cold climatic region, matching Energy Victoria’s regional cold
  ceiling insulation scenario.
