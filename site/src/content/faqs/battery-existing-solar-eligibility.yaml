question: Can I claim the federal battery discount when adding a battery to existing solar panels?
answer: Yes, provided the battery has a nominal capacity of 5 to 100 kWh, appears on the Clean Energy Council approved product list, and is installed by a Solar Accreditation Australia accredited installer onto an eligible new or existing rooftop solar system. If you also need rooftop panels, check our [solar panel rebate guide](/victoria/solar-panel-rebate/) first.
