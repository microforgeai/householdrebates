question: Is the home battery discount in Victoria a state or federal program?
answer: It is an Australian Government program called Cheaper Home Batteries, delivered nationwide through the Small-scale Renewable Energy Scheme rather than through Victorian Energy Upgrades. Victoria does not currently run a separate state household battery grant or battery loan, so your installer applies the federal certificate discount directly on the quote.
