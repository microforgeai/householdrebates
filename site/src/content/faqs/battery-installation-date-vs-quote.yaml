question: Does signing a battery quote in December 2026 lock in the 2026 certificate rate?
answer: No. Under Clean Energy Regulator rules, the installation and electrical compliance date sets the small-scale technology certificate factor, not the date you sign a quote or pay a deposit. A system installed on or after 1 January 2027 receives the lower January to June 2027 certificate factor even if the contract was signed in 2026.
