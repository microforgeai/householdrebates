question: Are batteries larger than 50 kWh eligible for Cheaper Home Batteries?
answer: Yes, batteries up to 100 kWh of nominal capacity remain eligible for the program, although small-scale technology certificates are only created on the first 50 kWh of usable capacity across the three taper bands. Homes, small businesses, and community facilities comparing larger systems can also check [Victorian business energy upgrades](/victoria/business-energy-upgrades/).
