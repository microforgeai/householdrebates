question: Does the City of Greater Bendigo offer in-home energy advice or workshops?
answer: Yes. The City of Greater Bendigo runs a Home Energy Empowerment Program
  featuring In-Home Energy Snapshots and practical DIY energy-efficiency
  workshops for local residents. Visit the council’s Saving Energy page linked
  below for booking availability.
