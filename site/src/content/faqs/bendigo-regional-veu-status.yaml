question: How are Bendigo postcodes classified in the VEU postcode table?
answer: "All 11 Greater Bendigo postcodes in VEU Specifications version 25 sit in
  Regional, Cold climatic region, and heat pump zone 4: urban postcodes 3550,
  3551, 3555, and 3556 have reticulated gas, while 3515 (Marong), 3523
  (Heathcote), 3557 (Goornong), 3558 (Elmore), 3570 (Neilborough), and PO-box
  postcodes 3552 and 3554 have no reticulated mains gas."
