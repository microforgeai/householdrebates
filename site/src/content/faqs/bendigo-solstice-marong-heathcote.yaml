question: What happened to the Solstice compressed natural gas network in Marong
  and Heathcote?
answer: City of Greater Bendigo guidance states that Solstice Energy’s
  compressed natural gas networks in Marong (postcode 3515) and Heathcote
  (postcode 3523) were scheduled for decommissioning after 2 August 2026 in
  Marong and after 16 August 2026 in Heathcote. Impacted Solstice customers
  receive special Solar Victoria eligibility exemptions, including access
  regardless of household income or hot water system age.
