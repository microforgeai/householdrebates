question: Are refrigerated display cabinets and cool-room fan motors covered by VEU?
answer: High-efficiency refrigerated display cabinets (Part 32) and refrigeration fan motors (Part 33) are active VEU commercial specifications, though Energy Victoria does not publish a standard consumer dollar example for either activity. An [accredited provider](/victoria/find-an-accredited-provider/) assesses your cabinet models or fan motors and confirms any upfront discount in writing.
