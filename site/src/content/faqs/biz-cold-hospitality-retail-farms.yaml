question: Can cafes, butchers, grocers, and farms apply for VEU refrigeration upgrades?
answer: Yes—walk-in cool rooms and freezers in cafes, restaurants, bottle shops, butchers, independent grocers, and horticultural or dairy packhouses can use the commercial cold room activity if the premises is not an un-opted-in scheduled industrial site. Businesses buying smaller plug-in units (250 to 700 L) can also check the high-efficiency fridge and freezer section on this page.
