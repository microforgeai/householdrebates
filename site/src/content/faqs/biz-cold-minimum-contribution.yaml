question: Is there a mandatory minimum customer payment for a VEU cold room upgrade?
answer: Yes—Energy Victoria requires a mandatory minimum customer contribution for every walk-in cold room upgrade, whether you install an electronic expansion valve and controller on a small room or complete a multi-part upgrade on a larger room. Check the published minimum payment figure in the cold room section on this page.
