question: What size and temperature rules apply to VEU walk-in cold room discounts?
answer: Under Energy Victoria's cold room activity, the enclosure must be a walk-in cool room or freezer with at least four square metres of floor area that stores goods below seven degrees Celsius or operates as a freezer. Reach-in cabinets and smaller under-bench chillers do not meet the walk-in cold room definition.
