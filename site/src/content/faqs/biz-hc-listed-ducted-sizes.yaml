question: Which commercial ducted air conditioner sizes does Energy Victoria list?
answer: Energy Victoria publishes indicative commercial reverse-cycle examples for 16 kW, 25 kW, 32 kW, and 56 kW ducted systems replacing ducted gas or older ducted reverse-cycle units, alongside room split systems from 3 to 9 kW and 10 kW multi-split upgrades. Compare every scenario in the size table on this page, and remember that an accredited provider confirms the final quote.
