question: Do businesses pay the same VEU minimum co-payment as households for air conditioning?
answer: Yes—under VEU Specifications Part 6, commercial premises pay the same mandatory customer co-payments per installed reverse-cycle unit that apply to homes, tiered across ducted systems, multi-split systems above or below 10 kW, and single non-ducted units. Read the full tier rules on our [VEU minimum co-payment guide](/victoria/veu-minimum-co-payment/).
