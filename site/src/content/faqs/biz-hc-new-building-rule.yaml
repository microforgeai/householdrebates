question: Can a newly built commercial premises get a VEU heating replacement discount?
answer: Replacement heating and cooling discounts under VEU require an existing building more than two years old, and the old gas or electric heater must be decommissioned where the upgrade scenario requires it. Separate lower-value non-decommissioning scenarios exist in the commercial table on this page, which your [accredited provider](/victoria/find-an-accredited-provider/) confirms before any work starts.
