question: Can a factory on the Scheduled Activity Premises register use commercial HVAC discounts?
answer: Premises on the Essential Services Commission Register of Scheduled Activity Premises are excluded from VEU heating and cooling discounts unless the business has opted in with the regulator. Check the scheduled premises rules on the [Victorian business energy upgrades hub](/victoria/business-energy-upgrades/) before requesting commercial HVAC quotes.
