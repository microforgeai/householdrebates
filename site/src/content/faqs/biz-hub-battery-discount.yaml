question: Can a Victorian business get a government discount for a solar battery?
answer: VEU does not currently list a standalone commercial battery discount, though the Australian Government Cheaper Home Batteries Program covers eligible small businesses and community organisations installing approved 5 to 100 kWh batteries connected to new or existing solar panels. Check our business battery section on this page for capacity rules and next steps.
