question: Which Victorian Energy Upgrades products are available only to businesses?
answer: Energy Victoria lists commercial and industrial lighting, commercial solar PV systems between 30 and 200 kW, walk-in cold rooms, pre-rinse spray valves, and high-efficiency electric motors as business-only VEU activities. Businesses can also access commercial heating and cooling, hot water, window glazing, and custom measurement and verification upgrades through a [VEU accredited provider](/victoria/find-an-accredited-provider/).
