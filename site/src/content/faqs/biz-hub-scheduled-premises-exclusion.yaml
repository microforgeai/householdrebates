question: Are large industrial energy users excluded from Victorian Energy Upgrades?
answer: Sites listed on the Essential Services Commission Register of Scheduled Activity Premises cannot use VEU discounts unless the site operator has formally opted in to the program. You can check the register before applying or run your premises through the Business path of the [Victoria Rebate Eligibility Checker](/victoria/eligibility-checker/).
