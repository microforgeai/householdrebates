question: How many standard hot water systems can a Victorian business upgrade under VEU?
answer: Energy Victoria states that Victorian businesses can upgrade up to five standard electric or gas hot water systems to approved heat pump or solar-boosted models using the standard per-system VEU discount rates and mandatory minimum contribution. Compare gas-to-heat-pump changeover rules in our [gas hot water to heat pump guide](/victoria/gas-hot-water-to-heat-pump/).
