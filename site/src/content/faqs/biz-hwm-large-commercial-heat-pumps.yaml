question: How do VEU rules change for large commercial and industrial heat pump water heaters?
answer: Under VEU Specifications Part 44, larger commercial and industrial heat pump hot water upgrades have no limit on the number of systems upgraded, carry a higher mandatory minimum customer contribution, and do not have a single published consumer discount figure. An [accredited provider](/victoria/find-an-accredited-provider/) models the site's thermal load and certificate yield before quoting.
