question: Which electric motor sizes are covered by VEU commercial motor discounts?
answer: Energy Victoria publishes indicative VEU motor examples from 15 kW and 75 kW units up to 185 kW high-efficiency and premium-efficiency three-phase motors used in pumps, fans, compressors, and processing equipment. Electric motor replacements larger than 185 kW are assessed through custom measurement and verification on the [Victorian business energy upgrades hub](/victoria/business-energy-upgrades/).
