question: When can a commercial kitchen get the VEU pre-rinse spray valve discount?
answer: Commercial kitchens in cafes, pubs, restaurants, hospitals, and food production sites can receive the per-valve VEU discount only where an existing pre-rinse spray valve or a dedicated plumbing fitting for one is already installed. Brand-new sink stations without an existing spray valve or fitting are not eligible.
