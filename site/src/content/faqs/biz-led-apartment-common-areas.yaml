question: Do apartment building corridors, foyers, and basement car parks count for VEU LED lighting?
answer: Possibly—VEU Specifications Part 34 includes Class 2 multi-residential common areas among building-based lighting environments, meaning an owners corporation upgrading fluorescent corridor or basement lighting may be eligible. Because strata wiring and existing lamp types vary, an accredited provider confirms eligibility—see our [apartments and owners corporations guide](/victoria/apartments-and-units/).
