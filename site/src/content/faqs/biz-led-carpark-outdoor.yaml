question: Can warehouses and car parks still upgrade metal halide or outdoor lighting?
answer: Yes—the fluorescent-only restriction applies specifically to indoor commercial lighting, while eligible non-building, car park, and outdoor floodlight or high-bay replacements (such as metal halide car park lights switched to LED high bays) remain open under VEU. Check the published commercial lighting table on this page and confirm luminaire eligibility with an [accredited provider](/victoria/find-an-accredited-provider/).
