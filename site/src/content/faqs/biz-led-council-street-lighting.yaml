question: Who can use VEU public and street lighting discounts in Victoria?
answer: Public lighting upgrades sit under VEU Specifications Part 27 and are designed for Victorian councils and road authorities upgrading street and public roadway lighting to approved LED luminaires. Commercial property owners upgrading private car parks or yard lighting use the commercial lighting activities rather than Part 27 street lighting.
