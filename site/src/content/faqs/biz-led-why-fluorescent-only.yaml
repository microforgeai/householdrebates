question: Why do indoor business LED discounts now require existing fluorescent lights?
answer: Energy Victoria states that indoor commercial lighting upgrades under VEU now apply only when replacing existing fluorescent tubes or fittings, reflecting higher baseline lighting efficiency across Victorian workplaces. If your shop or office already runs halogen, incandescent, or older LED indoor fittings, indoor VEU lighting certificates do not apply.
