question: "What if I sign a hot water replacement contract before 1 March 2027?"
answer: "Under regulation 45E(5) of the Plumbing Regulations (inserted by SR 140/2025), transitional work carried out within three months after 1 March 2027 under a contract signed with the owner before 1 March 2027 is exempt from the mains gas replacement ban."
