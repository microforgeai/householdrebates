question: "Does the 1 March 2027 replacement rule affect bottled LPG, gas heaters, or gas cooktops?"
answer: "No for owner-occupied homes. Victoria's Gas Substitution Roadmap confirms bottled LPG water heaters are not affected, and Energy Victoria confirms existing residential buildings can keep or replace gas space heaters and gas cooktops (though separate minimum standards apply to rental properties when a main living area heater fails)."
