question: "Can a faulty gas water heater still be replaced under warranty after 1 March 2027?"
answer: "Yes. Regulation 45E(4) exempts replacing a gas water heater during the manufacturer, supplier, or installer warranty period, and repairing an existing gas water heater also remains permitted."
