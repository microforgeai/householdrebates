question: How does the City of Casey DIY draught-proofing rebate work?
answer: The City of Casey offers one household rebate for eligible DIY
  draught-proofing products purchased with receipts dated within six months,
  claimed online through the council’s Rebately portal while municipal funding
  remains open. Residents can also hire an Energy and Water Efficiency Home
  Audit Kit through the council.
