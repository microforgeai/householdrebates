question: How does Casey’s DIY rebate differ from VEU weather sealing?
answer: Casey’s council rebate reimburses eligible DIY draught-proofing
  materials you buy and fit yourself, whereas the Victorian Energy Upgrades
  weather sealing discount applies to approved products professionally installed
  through a VEU accredited provider. Remember to check for open-flued or
  flueless indoor gas appliances before sealing vents in any home.
