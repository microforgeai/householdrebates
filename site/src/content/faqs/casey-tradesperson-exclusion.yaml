question: Can I use the City of Casey rebate to pay a tradesperson or buy
  ceiling insulation?
answer: No. City of Casey rules state that its DIY draught-proofing rebate
  cannot be claimed for paying a tradesperson, nor for ceiling insulation batts,
  double glazing, or heating system upgrades.
