question: "Does a Likely result in the checker confirm my final discount?"
answer: "No. Checker results are indicative only, based on published Victorian and federal program rules and VEU Specifications version 25.0. Only a VEU accredited provider (or an authorised Solar Victoria or battery retailer) can inspect your existing equipment, apply [minimum customer co-payments](/victoria/veu-minimum-co-payment/), and confirm your actual point-of-sale discount in a written quote before work starts—see [how VEU quotes work](/how-quotes-work/)."
