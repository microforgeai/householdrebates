question: Does a result in the Eligibility Checker confirm my final VEU discount?
answer: No. Checker results are indicative only, based on Energy Victoria's published household examples and VEU Specifications version 25.0. Only a VEU accredited provider (or a licensed installer partnered with one) can verify your existing appliance, check site constraints, and confirm your actual point-of-sale discount in a written quote before work starts—see [how VEU quotes work](/how-quotes-work/).
