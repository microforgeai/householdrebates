question: "Why does the checker ask for my postcode, and is anything stored?"
answer: "Your four-digit postcode sets your VEU area (Metropolitan or Regional), reticulated mains gas status, climate region, and heat pump zone from VEU Specifications version 25.0 Table A. Your postcode and answers stay in your browser—even if a renter generates a landlord share link, the answers live only in the URL hash and nothing is sent to or stored on a server."
