question: Which Victorian upgrades can I check in the Eligibility Checker?
answer: You can check household VEU rules across five upgrade categories—reverse-cycle heating and cooling, heat pump and solar-boosted hot water, [ceiling insulation](/victoria/ceiling-insulation-rebate/), [gas-to-induction cooktops](/victoria/gas-cooktop-to-induction/), and [draught proofing (weather sealing)](/victoria/draught-proofing-rebate/)—alongside mandatory minimum customer co-payments.
