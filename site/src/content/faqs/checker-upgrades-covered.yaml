question: "Which residential and business upgrades can I check here?"
answer: "You can check Victorian household and business rules across VEU discounts—[heating and cooling](/victoria/air-conditioner-rebate/), [heat pump hot water](/victoria/heat-pump-rebate/), [ceiling insulation](/victoria/ceiling-insulation-rebate/), [gas-to-induction cooktops](/victoria/gas-cooktop-to-induction/), [draught proofing](/victoria/draught-proofing-rebate/), window glazing, appliances, and commercial lighting, refrigeration, motors, and solar—plus [Solar Homes](/victoria/veu-vs-solar-homes/) rebates and the federal battery discount."
