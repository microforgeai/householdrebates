question: "Can I claim a Solar Homes hot water rebate if my address already had one?"
answer: "Solar Victoria's hot water rebate rules state that the property address must not have previously received a Solar Homes hot water rebate or a Solar Homes battery rebate, whereas VEU and Federal STCs can still apply if their separate conditions are met."
