question: "Are cold calls and doorknocking allowed under the Victorian Energy Upgrades program?"
answer: "No. Telemarketing cold calls have been banned since 1 May 2024 and doorknocking has been banned since 1 August 2024 under the VEU code of conduct, unless you have given express prior consent. Express prior consent given via an online enquiry form lasts for three months unless withdrawn sooner. Learn more about your rights on /how-quotes-work/."
