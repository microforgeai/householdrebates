question: Where can concession card holders get help with Victorian energy bills?
answer: The Victorian Government’s Energy Assistance Program provides free,
  one-on-one support to help eligible households check missing concessions,
  compare energy plans, and access retailer payment-difficulty assistance. You
  can reach the Energy Assistance Program through the official Energy Victoria
  link in the sources section below.
