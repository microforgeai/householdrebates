question: What happens to my Winter Gas Concession if I switch my home from gas
  to electric?
answer: The Winter Gas Concession applies only to mains gas usage and service
  charges billed between 1 May and 31 October, so closing your gas account ends
  gas bills and the gas concession together. Eligible Pensioner Concession Card,
  Health Care Card, and DVA Gold Card holders continue to receive the Annual
  Electricity Concession on their year-round electricity usage and service
  charges above the annual threshold shown on this page.
