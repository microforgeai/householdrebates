question: Does the Victorian Energy Upgrades program have an income test or
  require a concession card?
answer: No. Energy Victoria’s household heating, cooling, and hot water product
  pages apply no household income test and do not require a concession card to
  receive a point-of-sale VEU discount. By contrast, the separate Solar Homes
  program has a household taxable income cap for owner-occupiers—compare both
  schemes on /victoria/veu-vs-solar-homes/.
