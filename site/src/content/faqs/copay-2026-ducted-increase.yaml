question: "How did the heating and cooling minimum co-payments change on 30 September 2026?"
answer: "From 30 September 2026 under VEU Specifications version 25.0 (Part 6), the mandatory minimum customer co-payment increased for all household ducted reverse-cycle systems and larger multi-split or non-ducted systems, while single non-ducted splits below 10 kW kept the lower tier. Compare every tier on /victoria/veu-minimum-co-payment/."
