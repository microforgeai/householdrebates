question: "Can an installer refund or waive my VEU minimum co-payment?"
answer: "No. Under VEU Specifications version 25.0, the customer must genuinely pay at least the required GST-inclusive minimum co-payment per installed product, and an installer or accredited provider must not rebate, refund, or disguise that minimum contribution."
