question: "Why can't a VEU discount cover the entire cost of my upgrade?"
answer: "Victorian Energy Upgrades rules set mandatory minimum customer co-payments across hot water, heating and cooling, ceiling insulation, and induction cooktops so households contribute toward the equipment and installation rather than receiving zero-cost installations. Check the full co-payment table on /victoria/veu-minimum-co-payment/."
