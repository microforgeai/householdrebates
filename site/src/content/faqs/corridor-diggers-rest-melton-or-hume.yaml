question: "Is Diggers Rest in Melton or Hume for energy rebates?"
answer: "Both councils cover parts of postcode 3427. Under Australian Bureau of Statistics ASGS Edition 3 dwelling allocations, about 93 per cent of 3427 dwellings sit in the City of Melton and about 7 per cent sit in Hume City. For Victorian Energy Upgrades (VEU) and Solar Homes, your council boundary does not change state eligibility because all of 3427 is classified as Metropolitan, reticulated gas, Mild climatic region, and heat pump zone 4. Your council only changes municipal support—check your rates notice to see whether Melton's Living Green Power-Mate meter loans or Hume's Household Energy Officer apply, or test your address in the [Victoria Eligibility Checker](/victoria/eligibility-checker/)."
