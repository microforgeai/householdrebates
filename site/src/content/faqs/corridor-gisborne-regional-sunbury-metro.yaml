question: "Why is Gisborne classified as regional while Sunbury is metropolitan in VEU?"
answer: "Victorian Energy Upgrades uses its own Location Variable List (Table A in VEU Specifications v25.0) rather than municipal boundaries or train fare zones. In Table A, Sunbury (3429) and Bulla (3428) are Metropolitan, Mild, and heat pump zone 4; moving north up the Calder corridor, New Gisborne (3438) and Riddells Creek (3431) stay Metropolitan but shift to Cold and heat pump zone 5; and Gisborne (3437) shifts to Regional, Cold, and heat pump zone 5. That Table A split changes certificate calculations for [ceiling insulation discounts](/victoria/ceiling-insulation-rebate/) and cold-climate heat pump sizing—check any postcode on our [Victorian Postcode Lookup](/victoria/postcode/)."
