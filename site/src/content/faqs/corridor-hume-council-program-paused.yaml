question: "Is the Hume Home Energy Upgrades council program open?"
answer: "No. Registrations for Hume Home Energy Upgrades are paused after delivery partner Yarra Energy Foundation entered voluntary administration. Only insulation and draught-proofing registrations lodged before 19 October 2026 continue through the appointed supplier, while solar, battery, reverse-cycle air conditioning, heat pump hot water, and induction cooktop quotes under the council program remain paused. Sunbury, Bulla, and Hume-side Diggers Rest households can still claim state-wide VEU discounts directly through any accredited provider—see [how to find an accredited VEU provider](/victoria/find-an-accredited-provider/)—and can contact Hume City Council's Household Energy Officer for energy bill concession guidance."
