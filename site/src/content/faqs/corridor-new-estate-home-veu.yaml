question: "Can a new estate home in Melton, Sunbury, or Diggers Rest get VEU discounts?"
answer: "It depends on the age of the home and the upgrade. Energy Victoria's household replacement discounts for heating, cooling, and hot water require a building more than two years old, so a newly built estate home under two years old cannot claim replacement discounts. New builds installing a reverse-cycle split system without removing an existing heater only attract Energy Victoria's smaller no-decommissioning discount, while eligible owner-occupiers can still apply for Solar Homes rooftop solar rebates during construction. Under currently legislated rules from 1 January 2027, new Victorian homes must be built all-electric—read our [new all-electric homes in Victoria (2027) guide](/victoria/new-homes-all-electric-2027/)."
