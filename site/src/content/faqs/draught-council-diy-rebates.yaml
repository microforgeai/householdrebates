question: Are there Victorian council rebates for DIY draught-proofing products?
answer: Some local councils run separate municipal rebates alongside VEU—for example, the City of Casey offers a household rebate for eligible DIY draught-proofing products, limited to one claim per household. Check our guide to [City of Casey energy rebates](/victoria/casey/) or your own council’s sustainability page for current opening dates and receipt rules.
