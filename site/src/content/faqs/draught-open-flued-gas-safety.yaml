question: Why don’t homes with open-flued or flueless gas heaters qualify for
  VEU weather sealing?
answer: Sealing air vents, chimneys, and door gaps in a home that still operates
  an open-flued or flueless indoor gas space heater or open-flued indoor gas
  water heater can starve the burner of ventilation and draw dangerous carbon
  monoxide back into living rooms. Because of that carbon monoxide risk, Energy
  Victoria excludes those homes from VEU weather sealing until unsafe gas
  appliances are removed or replaced.
