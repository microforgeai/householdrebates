question: What parts of a home can be sealed under VEU weather sealing?
answer: Energy Victoria lists weather sealing upgrades covering external doors,
  windows, exhaust fans, wall vents, chimneys, and evaporative cooler vents
  using approved draught-proofing products installed by an accredited provider’s
  installer. Indicative discounts vary between apartments, townhouses, and
  detached houses and whether the installed products carry a two-year or
  five-year warranty.
