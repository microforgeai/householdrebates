question: What building-age and warranty rules apply when replacing ducted gas heating?
answer: Energy Victoria's household heating and cooling rules require your home to be more than two years old when replacing an existing ducted gas heater, the new ducted reverse-cycle unit to appear on the VEU Register of Products with at least a five-year household warranty, and a VEU accredited provider to be engaged before the old furnace is disconnected—see [the VEU timing rules](/victoria/reverse-cycle-vs-gas-heater/).
