question: How do yearly heating bills compare after replacing ducted gas with ducted reverse-cycle?
answer: Energy Victoria's heating and cooling product guide publishes an indicative yearly energy bill saving for households switching from ducted gas heating to an efficient ducted reverse-cycle system—see [the annual running-cost savings section above](/victoria/ducted-gas-to-ducted-reverse-cycle/#annual-running-cost-savings-and-eligibility-rules) or compare multi-room splits in our [ducted gas to split systems guide](/victoria/ducted-gas-to-split-systems/).
