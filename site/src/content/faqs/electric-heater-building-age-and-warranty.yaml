question: What building-age, warranty, and timing rules apply when replacing a fixed electric heater?
answer: To claim an electric-heater replacement discount under VEU, your building must be more than two years old, the new split or ducted reverse-cycle system must be on the VEU Register of Products with at least a five-year household warranty, and an accredited provider must record pre-installation evidence before the hard-wired panel, slab, or central electric heater is decommissioned—see [the VEU timing rules](/victoria/reverse-cycle-vs-gas-heater/).
