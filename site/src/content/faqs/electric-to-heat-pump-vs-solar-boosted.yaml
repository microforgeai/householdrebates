question: "Should I replace an electric hot water tank with a heat pump or a solar-boosted system?"
answer: "Both options are eligible on the VEU Register of Products when replacing an inefficient electric water heater in a building at least two years old. A solar-boosted system uses roof-mounted collectors and has a higher indicative VEU discount, while a heat pump needs no roof plumbing and can still pair with existing solar PV panels via a timer."
