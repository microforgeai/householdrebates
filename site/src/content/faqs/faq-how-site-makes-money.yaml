question: How does Household Rebates make money, and is the quote form open?
answer: Reading our guides and using the [Victoria Rebate Eligibility Checker](/victoria/eligibility-checker/) costs households nothing. Our quote request form is currently closed while partner installer agreements are being finalised; when the form opens for a postcode, named participating installers pay Agenor Services Pty Ltd a flat fee for valid, consented enquiries—read [About Household Rebates and how we are paid](/about/#how-we-are-paid).
