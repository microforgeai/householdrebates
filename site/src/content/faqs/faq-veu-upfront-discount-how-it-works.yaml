question: Are Victorian Energy Upgrades discounts paid as cash back or taken off your quote?
answer: Under the Victorian Energy Upgrades program, discounts are normally applied upfront as a point-of-sale deduction on your written quote when you assign the right to create [Victorian Energy Efficiency Certificates (VEECs)](/victoria/what-is-a-veec/) to an accredited provider before installation starts, rather than claiming a cash grant afterwards—see [how VEU quotes work](/how-quotes-work/).
