question: "Which gives a larger VEU discount when replacing ducted gas: four single splits or a multi-split?"
answer: In Energy Victoria's published household examples, decommissioning a ducted gas heater for a multi-split system with a 10 kW outdoor unit has a slightly higher indicative maximum discount than installing four separate single split systems, though the minimum customer co-payment rules also differ by system configuration and capacity. Compare both options in the scenario table above.
