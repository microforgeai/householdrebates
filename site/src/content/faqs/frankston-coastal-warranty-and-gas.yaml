question: Do coastal homes in Frankston and Seaford have different VEU warranty or mains-gas rules?
answer: Coastal installations in Frankston (3199) and Seaford (3198) must still use a VEU-approved reverse-cycle air conditioner or heat pump water heater carrying at least a five-year household warranty. Because all five Frankston City postcodes sit on the reticulated mains gas network in VEU Table A, existing homes on mains gas also fall under [Victoria's 1 March 2027 gas hot water replacement rule](/victoria/gas-to-electric-hot-water-2027/) when a mains gas water heater fails beyond repair.
