question: Does Frankston City Council offer a municipal energy rebate or upgrade guidance?
answer: Frankston City Council publishes household Saving Energy guidance promoting energy efficiency and switching from fossil gas appliances to electric alternatives across Frankston, Seaford, Carrum Downs, and Langwarrin, while upfront installation discounts come through the state-wide [Victorian Energy Upgrades program](/victoria/) and Solar Victoria's Solar Homes program.
