question: What is the Electric Homes Program 2026–27 in Greater Geelong?
answer: Operated by Geelong Sustainability, the Electric Homes Program 2026–27 is a community-council advice and bulk-buy partnership open to households across Greater Geelong, Surf Coast, Golden Plains, Colac Otway, and the Borough of Queenscliffe, with expressions of interest open from 5 October 2026 alongside state-wide [Victorian Energy Upgrades discounts](/victoria/).
