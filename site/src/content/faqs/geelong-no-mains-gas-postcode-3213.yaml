question: Which Greater Geelong postcode has no reticulated gas in VEU Table A, and why aren't 3221 and 3225 listed here?
answer: Out of the 14 postcodes whose primary council is the City of Greater Geelong, postcode 3213 (Lovely Banks, Batesford, Anakie, and Moorabool—83% Greater Geelong and 17% Golden Plains by 2021 Census dwellings) is the single postcode listed without reticulated gas in VEU Specifications version 25.0 Table A, while the other 13 postcodes have reticulated gas. Postcode 3221 sits primarily in Surf Coast Shire and postcode 3225 sits in the Borough of Queenscliffe under ABS ASGS allocations.
