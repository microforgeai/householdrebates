question: Why doesn't Energy Victoria's regional cold ceiling insulation figure apply directly to Geelong?
answer: All 14 Greater Geelong postcodes are classified in VEU Specifications version 25.0 Table A as Regional with a Mild climatic region, whereas Energy Victoria's two published 150 m² ceiling insulation examples cover Metropolitan Mild and Regional Cold postcodes. See [the ceiling insulation section above](/victoria/geelong/#ceiling-insulation-discounts-in-geelong) for our labelled Regional Mild estimate and [our Victoria ceiling insulation guide](/victoria/ceiling-insulation-rebate/).
