question: What is the difference between replacing a hard-wired room heater and a central electric ducted heater?
answer: Replacing a hard-wired electric resistance room heater (such as a fixed wall panel or slab heater) with a 3 to 9 kW split system falls under the non-ducted replacement scenario, whereas replacing a central electric resistance ducted heater with a 10 to 22.4 kW ducted reverse-cycle system falls under the ducted scenario and carries the ducted minimum co-payment. Compare both figures in the discount tables above.
