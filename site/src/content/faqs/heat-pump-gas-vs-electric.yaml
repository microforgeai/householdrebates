question: "Why is the VEU heat pump discount different when replacing gas versus electric hot water?"
answer: "Under the Victorian Energy Upgrades methodology, replacing an inefficient electric resistance water heater saves more calculated emissions than replacing a mains gas water heater, so the point-of-sale discount differs between the two scenarios. Check the exact figures for both replacement types on /victoria/heat-pump-rebate/."
