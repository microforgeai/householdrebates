question: Why is the VEU heat pump discount different when replacing gas versus electric hot water?
answer: Under the Victorian Energy Upgrades methodology, replacing an inefficient electric resistance water heater saves more calculated greenhouse gas emissions than replacing a mains gas water heater, so Energy Victoria's indicative discount differs between the two scenarios—compare [the VEU household hot water scenarios above](/victoria/heat-pump-rebate/#veu-household-hot-water-discount-scenarios).
