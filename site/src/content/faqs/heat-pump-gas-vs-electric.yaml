question: Why is the VEU heat pump discount different when replacing gas versus electric hot water?
answer: Under the Victorian Energy Upgrades methodology, replacing an inefficient electric resistance water heater saves more calculated emissions than replacing a mains gas water heater, so the [heat pump rebate in Victoria](/victoria/heat-pump-rebate/) differs between the two replacement scenarios.
