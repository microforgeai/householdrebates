question: How many hot water systems can one household upgrade under VEU, and what building age applies?
answer: Energy Victoria states that a household can upgrade up to two hot water systems at the same address under the Victorian Energy Upgrades program, provided you are replacing an existing water heater in a building at least two years old with a VEU-approved unit carrying a minimum five-year warranty—see [whether you can claim VEU discounts twice](/victoria/can-you-claim-veu-twice/).
