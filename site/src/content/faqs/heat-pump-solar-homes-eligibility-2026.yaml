question: Who is eligible to stack the Solar Homes hot water rebate with a VEU discount?
answer: Solar Victoria's standalone hot water rebate requires you to be an owner-occupier, meet the combined household taxable income cap introduced on 1 July 2026 and the property value cap shown in [the Solar Homes section above](/victoria/heat-pump-rebate/#solar-homes-hot-water-rebate), replace an existing water heater at least three years old, and obtain Solar Victoria pre-approval before installing within 120 days—compare [how VEU and Solar Homes rules differ](/victoria/veu-vs-solar-homes/).
