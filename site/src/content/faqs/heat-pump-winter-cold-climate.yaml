question: "Will a heat pump hot water system still work in a cold Victorian winter?"
answer: "Modern air-source heat pumps extract heat from outdoor air even in winter, though colder Victorian postcodes should choose a frost-protected model suited to cold climates (including models with a booster element where needed) and place the unit in a well-ventilated outdoor spot away from bedroom windows."
