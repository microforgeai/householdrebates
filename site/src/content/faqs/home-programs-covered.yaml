question: Which energy discount and rebate programs does this site cover?
answer: Our Victorian guides cover upfront [Victorian Energy Upgrades (VEU) discounts](/victoria/) across heating and cooling, hot water, ceiling insulation, induction cooktops, and weather sealing, alongside Solar Victoria's Solar Homes rebates—compare [how VEU and Solar Homes differ](/victoria/veu-vs-solar-homes/)—plus verified local council energy programs and Victoria's currently legislated 2027 electrification rules.
