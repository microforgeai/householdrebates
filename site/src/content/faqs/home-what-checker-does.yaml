question: What does the Victoria Rebate Eligibility Checker do?
answer: The [Victoria Rebate Eligibility Checker](/victoria/eligibility-checker/) matches your postcode, building age, tenure, and existing heating, hot water, insulation, cooktop, or draught-proofing setup against Energy Victoria's current household rules and mandatory minimum co-payments. All answers stay in your browser, and an accredited provider confirms your exact discount in writing before work starts.
