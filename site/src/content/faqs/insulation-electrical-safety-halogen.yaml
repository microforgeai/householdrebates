question: "What happens if my ceiling has halogen downlights or unsafe electrical wiring?"
answer: "Under Energy Victoria's ceiling insulation rules, a licensed electrician must complete a pre-installation electrical safety assessment alongside an installer safety assessment before any insulation is laid. Homes with recessed halogen downlights or unsafe wiring are ineligible until those electrical hazards are rectified."
