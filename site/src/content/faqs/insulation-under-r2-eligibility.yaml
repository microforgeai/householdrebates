question: "How do I know if my ceiling insulation is low enough to qualify for the VEU discount?"
answer: "Energy Victoria states that a Victorian home is eligible if the ceiling is uninsulated or has existing ceiling insulation rated below R2.0, which is roughly 90 mm thick or sitting lower than the height of a ceiling joist. An accredited provider's certified installer inspects and confirms your ceiling before work starts."
