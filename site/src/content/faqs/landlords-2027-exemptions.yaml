question: What exemptions apply to Victoria’s 2027 rental minimum energy
  efficiency standards?
answer: Consumer Affairs Victoria lists specific technical and legal exemptions,
  including buildings served by centralised heating, cooling, or hot water
  systems, properties with no suitable space for an external compressor,
  heritage restrictions, or owners-corporation rules that prohibit the
  installation. Because exemptions depend on your building and lease
  circumstances, check Consumer Affairs Victoria’s official guidance before
  relying on an exemption.
