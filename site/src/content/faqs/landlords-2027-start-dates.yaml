question: When does each Victorian rental energy efficiency standard start?
answer: Under currently legislated rules from 1 March 2027, ceiling insulation
  to at least R5.0 (where none is present), 4-star WELS showerheads, and main
  living area cooling apply at the start of a new lease, while failed hot water
  units and failed main living area heaters must be replaced with efficient
  electric systems when they break down beyond repair. Currently legislated
  draught-proofing standards commence on 1 July 2027, and the cooling requirement
  applies across all remaining rentals from 1 July 2030.
