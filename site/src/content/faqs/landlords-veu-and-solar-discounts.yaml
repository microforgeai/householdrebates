question: Can Victorian rental providers claim VEU discounts and Solar Homes rebates?
answer: Yes. Consumer Affairs Victoria notes that upgrades meeting the rental
  minimum standards are eligible for Victorian Energy Upgrades point-of-sale
  discounts through accredited providers, including reverse-cycle air
  conditioning, heat pump hot water, ceiling insulation, and weather sealing.
  Energy Victoria also notes that rental providers can apply for the Solar Homes
  solar panel rebate on up to two rental properties per financial year; see the
  indicative amounts in the sections above.
