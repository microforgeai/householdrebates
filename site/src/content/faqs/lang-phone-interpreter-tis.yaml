question: Can I get a phone interpreter when calling about Victorian energy rebates?
answer: Yes. Call the National Translating and Interpreting Service (TIS National) on 131 450, state the language you speak, and ask the interpreter to connect you to Solar Victoria, Energy Victoria, or the Essential Services Commission.
