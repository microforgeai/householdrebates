question: Where can I read Victorian energy rebate information in Punjabi or Sinhalese?
answer: Solar Victoria publishes official Solar Homes program summaries in both Punjabi and Sinhalese (linked in the Solar Victoria table on this page), whereas Energy Victoria's VEU consumer-rights translations page does not currently list a Punjabi or Sinhalese factsheet. Speakers of Punjabi or Sinhalese who have questions about VEU upgrades can also call TIS National on 131 450, and western Melbourne residents can check interpreted webinars listed on our [Wyndham rebates guide](/victoria/wyndham/).
