question: How can non-English speakers check if a VEU rebate offer is genuine?
answer: Uninvited telemarketing calls and door-to-door sales visits for Victorian Energy Upgrades are banned across Victoria without your express prior consent, and no installer works for the Victorian Government. Read the translated VEU consumer-rights factsheet for your language if listed above, check our [VEU scams and cold-call ban guide](/victoria/veu-scams-cold-calls/), and review [how quotes and consent work](/how-quotes-work/) before signing anything.
