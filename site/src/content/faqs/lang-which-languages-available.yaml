question: Which community languages have official Victorian energy rebate translations?
answer: Energy Victoria and Solar Victoria publish separate translation lists rather than one combined set. Energy Victoria lists Arabic, Simplified Chinese, Traditional Chinese, Filipino, Greek, Hazaragi, Hindi, Italian, Khmer, Turkish, and Vietnamese for the VEU consumer-rights factsheet, while Solar Victoria publishes Solar Homes summaries in Arabic, Dinka, Greek, Hindi, Italian, Nuer, Punjabi, Simplified Chinese, Sinhalese, Spanish, Tamil, Traditional Chinese, Turkish, and Vietnamese.
