question: "What was the Morwell Electri-fair-cation project in the Latrobe Valley?"
answer: "The AusNet and Gippsland Climate Change Network (GCCN) Electri-fair-cation Project (2024–26), delivered with Morwell Neighbourhood House, supported clusters of Morwell households to switch to electric cooking, reverse-cycle heating, hot water, solar, ceiling insulation, and draught proofing. GCCN records the street-cluster trial as completed in 2026, so new applicants now use ongoing state-wide VEU discounts, Solar Homes rebates, and the SEC Latrobe pilot—map your own sequence in the [Get-Off-Gas Planner](/victoria/get-off-gas-planner/)."
