question: "Is there an SEC heat pump hot water offer in the Latrobe Valley?"
answer: "Yes. The Victorian Government's state-owned SEC extended its heat pump hot water one-stop-shop pilot to Latrobe City, covering Morwell, Moe, Newborough, Traralgon, and Churchill. Through SEC's online planner, households can compare vetted heat pump models, see upfront VEU and Solar Homes point-of-sale deductions applied, and request no-obligation quotes from SEC-endorsed installers. You can also compare other registered operators on [how to find an accredited provider](/victoria/find-an-accredited-provider/)."
