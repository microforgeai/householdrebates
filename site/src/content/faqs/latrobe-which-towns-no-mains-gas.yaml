question: "Which Latrobe Valley postcodes have no mains gas in VEU Table A?"
answer: "Five of Latrobe City's nine VEU Table A postcodes are listed without reticulated mains gas: Gippsland Mail Centre PO boxes (3841), Glengarry (3854), Toongabbie (3856), Yinnar and Yinnar South (3869), and Boolarra (3870). By contrast, Moe and Newborough (3825), Morwell (3840), Churchill (3842), and Traralgon (3844) are listed with reticulated gas. Check hot water replacement options in [gas hot water to heat pump](/victoria/gas-hot-water-to-heat-pump/) or test your postcode in the [Victoria Eligibility Checker](/victoria/eligibility-checker/)."
