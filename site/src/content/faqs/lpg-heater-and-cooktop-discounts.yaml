question: "Can I claim VEU discounts to replace an LPG room heater or an LPG cooktop?"
answer: "Yes, where an accredited provider confirms your appliance and home meet the activity rules. Energy Victoria's non-ducted gas heater category includes natural gas and LPG room heaters replaced with a reverse-cycle split system, and VEU Specifications Part 46 covers induction cooktops at homes with a gas or LPG connection. Compare [replacing a gas room heater with a split system](/victoria/gas-room-heater-to-split-system/) and [switching a gas cooktop to induction](/victoria/gas-cooktop-to-induction/)."
