question: "Is bottled LPG or piped estate LPG covered by the 1 March 2027 gas hot water rule?"
answer: "Under Building and Plumbing Amendment Regulations 2025 regulation 45E as currently legislated, the 1 March 2027 restriction applies to a gas water heater connected to reticulated gas in an existing Class 1 or Class 2 home. A bottled-LPG water heater is not connected to reticulated gas, so it sits outside that rule. If your estate has piped LPG, your plumber confirms whether the rule applies to your water heater."
