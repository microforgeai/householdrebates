question: "Can I get the VEU hot water discount when replacing a bottled LPG water heater?"
answer: "Victorian Energy Upgrades Part 3 covers decommissioning an existing gas or LPG water heater and installing an electric-boosted solar or heat pump water heater. Energy Victoria publishes an indicative household figure only for mains gas, so your accredited provider confirms the VEEC discount for an LPG hot water replacement before work starts. See [VEU hot water discounts for LPG homes](/victoria/lpg-homes/#veu-hot-water-discounts-for-lpg-homes) and [replacing gas hot water with a heat pump](/victoria/gas-hot-water-to-heat-pump/)."
