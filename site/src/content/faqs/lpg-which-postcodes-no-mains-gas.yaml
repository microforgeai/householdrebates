question: "Which Victorian postcodes have no reticulated mains gas?"
answer: "Hundreds of regional and outer-fringe postcodes in VEU Specifications v25.0 Table A are recorded with no reticulated mains gas, including semi-rural townships across [Macedon Ranges](/victoria/macedon-ranges/) and wider regional Victoria. Use the [Victorian VEU postcode lookup](/victoria/postcode/) to check whether your postcode has reticulated gas, its VEU climate region, and its heat pump zone."
