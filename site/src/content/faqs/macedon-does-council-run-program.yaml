question: "Does Macedon Ranges Shire Council run a household energy rebate program?"
answer: "Macedon Ranges Shire Council does not offer a direct council cash rebate, though it lends library Sustainable Home Kits, runs Empower Your Home webinars, and supports Cool Changes community climate plans across seven town groups. Separately, the Transition to Zero Macedon Ranges heat pump bulk buy closed to new enquiries on 31 October 2026, with installations for existing bookings finishing 30 November 2026. Residents can still access state-wide VEU point-of-sale discounts through an accredited provider—check options on [how to find an accredited provider](/victoria/find-an-accredited-provider/)."
