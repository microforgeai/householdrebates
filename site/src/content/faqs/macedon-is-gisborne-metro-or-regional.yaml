question: "Is Gisborne classified as metropolitan or regional for VEU discounts?"
answer: "VEU Specifications v25.0 Table A classifies Gisborne, Gisborne South, and Bullengarook (3437) as Regional, Cold, and heat pump zone 5, whereas neighbouring New Gisborne (3438) and Riddells Creek (3431) are classified as Metropolitan, Cold, and heat pump zone 5. That Table A column difference changes the regional multiplier in VEU Part 48 [ceiling insulation discounts](/victoria/ceiling-insulation-rebate/). You can look up any surrounding postcode on our [Victorian Postcode Lookup](/victoria/postcode/)."
