question: "Which heat pump hot water zone applies across Macedon Ranges postcodes?"
answer: "Southern and eastern Macedon Ranges postcodes from 3430 to 3438—covering Clarkefield, Riddells Creek, Bolinda, Monegeetta, Romsey, Lancefield, Gisborne, and New Gisborne—sit in VEU heat pump zone 5. Northern postcodes from 3440 to 3446—covering Macedon, Mount Macedon, Woodend, Kyneton, and Malmsbury—sit in heat pump zone 4. VEU calculates water-heating certificates using your postcode's zone 4 or zone 5 rating, and cold-climate frost protection matters across the shire; see our [heat pump hot water size guide](/victoria/heat-pump-hot-water-size-guide/)."
