question: "Which Macedon Ranges towns have no mains gas in the VEU table?"
answer: "In VEU Specifications v25.0 Table A, four Macedon Ranges postcodes are listed with no reticulated gas: Clarkefield (3430), Bolinda (3432), Monegeetta (3433), and Malmsbury (3446). Off-gas properties replacing an inefficient electric resistance water heater follow VEU's electric-to-heat-pump discount, while bottled LPG water heaters fall under VEU Part 3 where the accredited provider confirms the certificate value. Compare steps on our [Get-Off-Gas Planner](/victoria/get-off-gas-planner/) or check your postcode in the [Victoria Eligibility Checker](/victoria/eligibility-checker/)."
