question: What happens on 1 March 2027 when a gas hot water system breaks down?
answer: Under the currently legislated [Victoria 1 March 2027 gas to electric hot water rule](/victoria/gas-to-electric-hot-water-2027/), when a mains gas water heater (including a gas pool heater) in an existing Victorian home reaches the end of its life and needs replacing, it generally cannot be replaced with another mains gas unit and must be replaced with an electric alternative such as a heat pump or solar-boosted system. Exemptions apply for certain technical constraints, and bottled LPG systems are not affected.
