question: What happens on 1 March 2027 when a gas hot water system breaks down?
answer: Under Victoria's currently legislated electrification standards, from 1 March 2027 a mains gas water heater (including a gas pool heater) in an existing home that reaches the end of its life and needs replacing generally cannot be replaced with another mains gas unit and must switch to an electric alternative such as a heat pump or solar-boosted system. Regulatory exemptions apply for specific space, switchboard, network, and Class 2 central-plant constraints—see [Victoria's 2027 gas hot water exemptions](/victoria/gas-hot-water-ban-exemptions/)—and bottled LPG systems are outside the reticulated gas rule.
