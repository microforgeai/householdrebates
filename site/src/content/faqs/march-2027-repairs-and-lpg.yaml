question: Can I still repair a mains gas water heater or keep bottled LPG after 1 March 2027?
answer: Yes. Energy Victoria confirms that if an existing mains gas water heater can be safely repaired, repairs remain permitted, and replacement during an active warranty period or under a contract signed before 1 March 2027 (completed within three months) is exempt under regulation 45E—see [broken gas hot water before or after 1 March 2027](/victoria/gas-hot-water-broken-before-or-after-march-2027/). Victoria's Gas Substitution Roadmap also confirms that bottled LPG water heaters are not affected by the reticulated gas rule.
