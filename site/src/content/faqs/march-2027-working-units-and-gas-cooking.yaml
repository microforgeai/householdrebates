question: Do I have to remove a working gas water heater, gas heater, or gas cooktop on 1 March 2027?
answer: No. Under Victoria's currently legislated electrification standards, working mains gas water heaters do not have to be removed early—the rule applies only when a mains gas water heater reaches the end of its life and needs replacing from 1 March 2027. Under the currently legislated 2027 rules, owner-occupiers are also not required to remove or replace existing gas space heaters or gas cooktops.
