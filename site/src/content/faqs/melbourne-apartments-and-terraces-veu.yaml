question: What should inner-Melbourne apartment and terrace owners check before booking a VEU upgrade?
answer: Confirm that your building is more than two years old when replacing an existing heater or water heater, check any owners-corporation rules for outdoor condenser or heat pump placement—see [apartments and units in Victoria](/victoria/apartments-and-units/)—and engage a VEU accredited provider before removing the old unit so pre-installation photos can be recorded.
