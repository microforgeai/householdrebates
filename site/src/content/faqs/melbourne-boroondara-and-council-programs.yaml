question: Which inner-Melbourne councils run local home energy or Solar Savers programs?
answer: Four inner-Melbourne councils—Yarra, Boroondara, Glen Eira, and Stonnington—participate in the Council Home Energy Program, and City of Boroondara residents can also access a council-administered Solar Savers offer until 31 December 2026 or until program funds run out; see the [council programs section on this page](/victoria/melbourne/#inner-melbourne-council-programs) for current status and discount details.
