question: What sustainable energy and apartment guidance does the City of Melbourne publish?
answer: Through its Sustainable Energy and Climate Change Mitigation Strategy programs, the City of Melbourne publishes guidance on saving energy at home and upgrading multi-unit residential buildings—compare state-wide rules for strata lots and owners corporations in our [Victoria apartments and units rebate guide](/victoria/apartments-and-units/).
