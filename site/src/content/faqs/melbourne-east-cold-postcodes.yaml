question: Which postcodes in Melbourne's east and the Dandenongs are classified as Cold in VEU Table A?
answer: Fifteen of the 65 eastern-region postcodes sit in the Cold climatic region—all inside [Yarra Ranges](/victoria/yarra-ranges/) across the Dandenong Ranges and Yarra Valley (3766, 3767, 3770, 3775, 3777, 3785, 3786, 3787, 3788, 3789, 3792, 3793, 3795, 3796, and Regional Warburton 3799)—which increases deemed certificate savings for [ceiling insulation upgrades](/victoria/ceiling-insulation-rebate/).
