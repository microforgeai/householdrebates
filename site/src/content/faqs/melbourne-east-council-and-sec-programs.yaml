question: Which councils in Melbourne's east participate in local or SEC energy programs?
answer: Knox, Maroondah, Monash, and [Yarra Ranges](/victoria/yarra-ranges/) participate in the Council Home Energy Program, and households in Maroondah and the Yarra Ranges can also access the state-owned SEC heat pump hot water pilot alongside any [accredited VEU provider](/victoria/find-an-accredited-provider/).
