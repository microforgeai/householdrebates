question: Which eastern Melbourne postcodes sit in heat pump zone 5?
answer: Seven postcodes in Melbourne's east sit in VEU heat pump zone 5—3139 (Wandin North, Seville, Launching Place, Beenak), 3140 (Lilydale), 3158 (Upwey), 3160 (Belgrave, Tecoma), 3770 (Coldstream, Yering), 3775 (Yarra Glen, Christmas Hills), and 3777 (Healesville, Badger Creek, Toolangi)—while the other 58 postcodes sit in zone 4; check frost-protection advice in our [heat pump hot water size guide](/victoria/heat-pump-hot-water-size-guide/).
