question: How are inner-Melbourne postcodes classified in VEU Specifications v25.0 Table A?
answer: Every inner-Melbourne postcode shown in the Table A schedule on this page—including Melbourne (3000, 3004), North Melbourne (3051), Brunswick (3056), Richmond (3121), and St Kilda (3182)—is classified as Metropolitan, on reticulated gas, Mild climatic region, and heat pump zone 4, so metropolitan VEU heating, hot water, and [ceiling insulation examples](/victoria/ceiling-insulation-rebate/) apply.
