question: How are the 52 inner-Melbourne postcodes classified in VEU Specifications v25.0 Table A?
answer: All 52 postcodes across the seven inner-Melbourne councils (Melbourne, Port Phillip, Yarra, Stonnington, Glen Eira, Boroondara, and Bayside) are classified in VEU Specifications v25.0 Table A as Metropolitan, on reticulated gas, Mild climatic region, and heat pump zone 4, so metropolitan VEU heating, hot water, and [ceiling insulation examples](/victoria/ceiling-insulation-rebate/) apply uniformly across the inner hub.
