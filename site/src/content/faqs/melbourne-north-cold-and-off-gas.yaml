question: Which postcodes in Melbourne's north are classified as Cold or off reticulated gas in VEU Table A?
answer: Out of the 66 northern-region postcodes, all eight Regional postcodes sit in [Mitchell Shire](/victoria/mitchell/) (3521, 3522, 3658, 3659, 3660, 3661, 3662, and 3764) and are classified as Cold, alongside Bylands (3762), which is Metropolitan and Cold (nine Cold postcodes in total). Six postcodes—3521, 3522, 3661, 3662, 3758, and 3762—are listed without reticulated gas in VEU Specifications v25.0 Table A.
