question: Are Hume Home Energy Upgrades and Darebin Energy Upgrades currently paused?
answer: Yes—both Hume Home Energy Upgrades and Darebin Energy Upgrades paused new registrations after delivery partner Yarra Energy Foundation entered voluntary administration in November 2026 (in Hume, only insulation and draught-proofing registrations lodged before 19 October 2026 continue). Residents in Hume and Darebin can still use state-wide VEU discounts through any [accredited VEU provider](/victoria/find-an-accredited-provider/).
