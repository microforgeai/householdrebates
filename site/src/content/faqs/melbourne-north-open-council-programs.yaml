question: Which council home energy programs are open in Melbourne's north?
answer: The Council Home Energy Program is open in Merri-bek and [City of Whittlesea](/victoria/whittlesea/) (where Whittlesea funds home energy assessments until June 2027 or until funding runs out), Goulburn Murray Solar Savers covers [Mitchell Shire](/victoria/mitchell/), Hume City Council's Household Energy Officer provides bill-relief guidance, and Merri-bek households can access the SEC installer network.
