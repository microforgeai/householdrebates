question: Which south-east Melbourne councils offer rebates or home energy programs?
answer: "[City of Casey](/victoria/casey/) offers a municipal DIY draught-proofing product rebate plus home audit kit hire and access to the SEC installer network, Kingston participates in the Council Home Energy Program, and [Frankston](/victoria/frankston/) and [Mornington Peninsula](/victoria/mornington-peninsula/) publish local electrification guidance."
