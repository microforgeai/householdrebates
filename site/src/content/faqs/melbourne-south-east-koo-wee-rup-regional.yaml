question: Is Koo Wee Rup classified as Regional or Cold in VEU Table A?
answer: Koo Wee Rup (3981, in Cardinia Shire) is the only Regional postcode among the 67 south-east hub postcodes and sits in the Cold climatic region, while neighbouring Tooradin (3980, in [City of Casey](/victoria/casey/)) is Metropolitan and Cold; see the [ceiling insulation section on this page](/victoria/melbourne-south-east/#south-east-insulation-and-table-a-exceptions) for how those two Cold postcodes differ from the rest of the south-east.
