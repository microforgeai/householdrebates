question: Which western Melbourne councils run home energy programs or meter loans?
answer: Brimbank participates in the Council Home Energy Program, [Wyndham City](/victoria/wyndham/) runs Energy Smart Homes with recorded workshops, a Your Go Electric Plan guide, and borrowable library efficiency kits, and Melton City Council lends Power-Mate Lite plug-in energy meters through its Living Green program.
