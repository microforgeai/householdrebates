question: Is any postcode in Melbourne's west classified as Regional under VEU Table A?
answer: Only Little River (3211, in [Wyndham City](/victoria/wyndham/)) is classified as Regional in VEU Specifications v25.0 Table A; the other 33 postcodes across Wyndham, Melton, Brimbank, Hobsons Bay, Maribyrnong, and Moonee Valley are Metropolitan, and all 34 western postcodes sit on reticulated gas in the Mild climatic region and heat pump zone 4.
