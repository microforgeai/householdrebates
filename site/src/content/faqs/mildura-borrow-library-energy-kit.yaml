question: "Can Mildura residents borrow a home energy assessment kit from the library?"
answer: "Yes. Mildura Rural City Council's Electrify Your Home program provides a Home Energy Efficiency Toolkit to borrow through Mildura Library (borrowers must be over 18 and sign a loan waiver). The kit includes a thermal imaging camera to spot missing ceiling or wall insulation and summer heat leaks, a PowerMate Lite plug-in appliance meter, an energy-saving thermometer, and a water-flow measuring cup to check shower flow rates before booking VEU upgrades."
