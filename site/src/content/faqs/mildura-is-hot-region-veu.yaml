question: "Is Mildura classified as a Hot climatic region for VEU discounts?"
answer: "Yes. All 12 Mildura Rural City Council postcodes in VEU Specifications v25.0 Table A—including PO-box postcode 3502—are classified as Regional, Hot climatic region, and heat pump zone 4, making up 12 of only 47 Hot postcodes across Victoria. Because VEU Part 48 assigns its lowest greenhouse gas savings factor (0.00546) to the Hot climatic region, ceiling insulation certificate discounts in Mildura are smaller than in Mild or Cold regions for the same roof area—see our [ceiling insulation rebate guide](/victoria/ceiling-insulation-rebate/)."
