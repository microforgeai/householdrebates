question: "Which Mildura and Mallee postcodes have mains gas versus no reticulated gas?"
answer: "Seven Mildura-council postcodes are listed with reticulated gas in VEU Table A: Colignan (3494), Red Cliffs (3496), Irymple (3498), Mildura (3500), Nichols Point (3501), Mildura PO boxes (3502), and Merbein (3505). Five southern Mallee postcodes in the municipality have no reticulated gas: Ouyen (3490), Cowangie (3506), Walpeup (3507), Underbool (3509), and Murrayville (3512). Compare hot water and cooling pathways in [air conditioner rebates in Victoria](/victoria/air-conditioner-rebate/) and the [Victoria Eligibility Checker](/victoria/eligibility-checker/)."
