question: Is there a minimum I have to pay for a ducted system?
answer: Yes. Under Victorian Energy Upgrades Specifications version 25.0 (Part 6), every household ducted reverse-cycle air conditioner of any capacity requires the highest mandatory minimum customer co-payment tier that took effect on 30 September 2026, so the discount cannot cover the full cost of the system. Compare every tier by system type in [the household co-payment table above](/victoria/veu-minimum-co-payment/#household-minimum-co-payments-from-30-september-2026).
