question: "Is Wallan classified as metropolitan or regional under Victorian Energy Upgrades?"
answer: "In VEU Specifications v25.0 Table A, Wallan (3756) and Beveridge (3753) are classified as Metropolitan with reticulated gas, Mild climatic region, and heat pump zone 4, alongside Wandong (3758, Metropolitan, Mild, no gas) and Bylands (3762, Metropolitan, Cold, no gas). Further north up the Hume corridor, Kilmore (3764), Broadford (3658), Tallarook (3659), and Seymour (3660) shift to Regional and Cold. Check any boundary locality on our [Victorian Postcode Lookup](/victoria/postcode/)."
