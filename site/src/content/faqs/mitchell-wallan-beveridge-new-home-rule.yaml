question: "Can a newly built estate home in Wallan or Beveridge claim VEU replacement discounts?"
answer: "Not for appliance replacements until the home is more than two years old. Energy Victoria's household heating, cooling, and hot water replacement discounts require an existing building older than two years. Homes under two years old in Wallan or Beveridge estates can check the smaller no-decommissioning split-system discount or Solar Victoria's rooftop solar PV rebate—see building-age rules in [new all-electric homes in Victoria (2027)](/victoria/new-homes-all-electric-2027/) and run your occupancy age in the [Victoria Eligibility Checker](/victoria/eligibility-checker/)."
