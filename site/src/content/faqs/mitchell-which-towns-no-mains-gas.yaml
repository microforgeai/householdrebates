question: "Which Mitchell Shire postcodes have no reticulated mains gas?"
answer: "Six of Mitchell Shire's 12 VEU Table A postcodes have no reticulated mains gas: Pyalong (3521), Tooborac (3522), Seymour PO boxes (3661), Puckapunyal (3662), Wandong and Heathcote Junction (3758), and Bylands (3762). Homes in those postcodes replacing electric resistance water heaters use VEU's electric-to-heat-pump pathway, while bottled LPG replacements are quoted individually by an accredited provider. Test your current setup in the [Victoria Eligibility Checker](/victoria/eligibility-checker/)."
