question: How do VEU hot water rules differ for Peninsula homes on electric storage or bottled LPG?
answer: Even though every Mornington Peninsula postcode is marked reticulated gas at the postcode level in Table A, many properties in hinterland and southern coastal localities such as Red Hill (3937), Main Ridge (3928), Flinders (3929), and Cape Schanck (3939) run electric storage or bottled LPG rather than mains gas. Replacing an inefficient electric storage unit follows Energy Victoria's higher electric-to-heat-pump row—see [our electric hot water to heat pump guide](/victoria/electric-hot-water-to-heat-pump/)—and bottled LPG water heaters are outside Victoria's 1 March 2027 reticulated gas replacement rule.
