question: What household energy guidance does Mornington Peninsula Shire publish?
answer: Under its Towards a Net Zero Peninsula initiatives, Mornington Peninsula Shire identifies household and business electricity and gas use as the shire's largest emissions source and publishes community renewable energy and energy-smart building guidance alongside state-wide [VEU heat pump and air conditioning discounts](/victoria/heat-pump-rebate/).
