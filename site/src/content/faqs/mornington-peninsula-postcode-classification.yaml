question: How are Mornington Peninsula Shire's 25 postcodes classified in VEU Table A?
answer: >-
  In VEU Specifications version 25.0 Table A, all 25 Mornington Peninsula Shire postcodes from 3911 to 3944 are classified as Metropolitan, reticulated gas, Mild climatic region, and heat pump zone 4. Under ABS 2021 Census dwelling allocations, 23 of those postcodes sit 100% within Mornington Peninsula Shire, while boundary postcodes 3911 (Baxter and Langwarrin South: 70% Mornington Peninsula, 30% Frankston) and 3912 (Somerville and Pearcedale: 78% Mornington Peninsula, 22% Casey) cross council lines.
