question: "Can I mix indoor and outdoor unit brands on a multi-split VEU upgrade?"
answer: "No. Under Victorian Energy Upgrades Specifications version 25.0, all indoor units connected to a multi-split system must come from the same manufacturer as the outdoor unit, and the product combination must be listed on the VEU Register of Products with at least a five-year household warranty."
