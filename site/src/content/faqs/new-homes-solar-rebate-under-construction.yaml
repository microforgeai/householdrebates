question: Can I claim the Solar Homes solar panel rebate while my new home is
  under construction?
answer: Yes. Energy Victoria and Solar Victoria allow eligible owner-occupiers
  building a new home to apply for the Solar Homes solar panel (PV) rebate while
  the home is under construction, with up to 270 days from approval to complete
  the solar installation.
