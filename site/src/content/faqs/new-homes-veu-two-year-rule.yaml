question: Why can’t newly built homes get the larger VEU heating and hot water
  replacement discounts?
answer: Most higher-value VEU household heating, cooling, and hot water
  discounts require decommissioning an existing inefficient system in a home
  that is more than two years old. Newly constructed homes have no old system to
  decommission and are under two years old, though Energy Victoria notes a
  modest VEU discount still exists when installing a reverse-cycle air
  conditioner with no heater decommissioned.
