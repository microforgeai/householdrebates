question: Does every double-glazing window replacement get a VEU discount?
answer: Only window products listed on the Essential Services Commission VEU register and installed through a participating accredited provider under Part 13 or Part 14 qualify for certificates. Because the certificate discount per square metre is modest compared with total window joinery costs, fewer providers offer residential glazing than [ceiling insulation](/victoria/ceiling-insulation-rebate/) or [draught proofing](/victoria/draught-proofing-rebate/).
