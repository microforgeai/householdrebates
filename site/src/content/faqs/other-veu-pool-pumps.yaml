question: Is there a VEU discount for pool pumps?
answer: Yes, the Essential Services Commission lists high-efficiency pool pumps (Part 26) as an eligible Victorian Energy Upgrades activity for both residential and non-residential premises. Energy Victoria does not publish an indicative household discount example for pool pumps, so ask an accredited provider whether your replacement pump model is on the VEU product register before buying.
