question: How do you claim VEU appliance discounts on fridges, clothes dryers, or TVs?
answer: Unlike heating or hot water upgrades, high-efficiency refrigerators, freezers, clothes dryers, and televisions are usually discounted at point of sale through participating appliance retailers partnered with a VEU accredited provider. You cannot buy an appliance first from a non-participating store and claim VEU certificates retrospectively after delivery.
