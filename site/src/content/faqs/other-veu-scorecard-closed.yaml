question: Why is the VEU Residential Efficiency Scorecard assessment no longer offered?
answer: No, the VEU Residential Efficiency Scorecard assessment activity (Part 45) closed on 23 June 2026 and is no longer available for Victorian Energy Upgrades certificates. Households planning upgrades can instead use our [Victoria Eligibility Checker](/victoria/eligibility-checker/) to check current VEU product rules.
