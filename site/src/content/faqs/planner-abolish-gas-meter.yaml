question: How do I abolish my gas meter once my last gas appliance is removed?
answer: Once a licensed gasfitter has disconnected and capped your final gas
  appliance, contact your gas retailer to request either meter removal or
  permanent service abolishment (cut-and-cap), which stops daily gas supply
  charges. AusNet publishes indicative timeframes of two business days for meter
  removal and up to 15 business days for service cut-and-cap, while other
  Victorian gas distributors publish their own schedules and regulated
  abolishment charges.
