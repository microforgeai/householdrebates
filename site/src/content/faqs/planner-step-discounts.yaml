question: Can I claim a separate VEU discount on each gas-to-electric step?
answer: Yes. Victorian Energy Upgrades offers separate household discounts
  across hot water, space heating and cooling, and induction cooktops, so you
  can electrify one appliance at a time or coordinate multiple upgrades without
  losing eligibility across categories. Remember to engage a VEU accredited
  provider before starting hot water or heating installation work.
