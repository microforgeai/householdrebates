question: What climate region is my postcode for VEU?
answer: VEU Specifications version 25.0 Table A assigns each of the 719 listed Victorian postcodes to a Mild (404 postcodes), Cold (268 postcodes), or Hot (47 postcodes) climatic region. Enter your 4-digit postcode in the search tool above, or check [what each postcode column means](/victoria/postcode/#what-each-column-means) and our [ceiling insulation rebate guide](/victoria/ceiling-insulation-rebate/).
