question: Which VEU ceiling insulation figure applies to my postcode?
answer: VEU Part 48 ceiling insulation calculations combine your postcode's climatic region (Mild, Cold, or Hot) with its area factor (Metropolitan or Regional), and the accredited provider confirms the exact discount in your written quote. Energy Victoria publishes examples for mild metropolitan and cold regional postcodes, and we list those alongside our Part 48 estimates for the other three Table A pairings under [insulation figures by postcode type](/victoria/postcode/#insulation-by-postcode).
