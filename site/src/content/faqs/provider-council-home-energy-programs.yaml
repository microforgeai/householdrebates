question: Do Victorian councils help residents find vetted upgrade installers?
answer: Yes. Several Victorian councils participate in council-backed home
  energy programs or route residents to vetted upgrade services, including
  programs in the City of Whittlesea and Yarra Ranges Shire. Check our local
  area guides as they roll out or visit your council’s sustainability page.
