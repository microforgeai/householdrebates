question: What is Easy Electric SEC?
answer: Easy Electric SEC is a free online quote-matching tool operated by the
  Victorian Government’s state-owned State Electricity Commission (SEC) that
  connects households with SEC-endorsed installers. According to the SEC, an
  endorsed installer contacts you within one business day after you submit your
  details through its tool.
