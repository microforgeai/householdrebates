question: What is the difference between a VEU accredited provider and a
  licensed installer?
answer: Only businesses accredited by the Essential Services Commission
  (accredited providers) can create Victorian Energy Efficiency Certificates and
  apply an upfront VEU discount. Many local plumbers and electricians are not
  accredited providers themselves, so if you choose your own tradesperson they
  must partner with an accredited provider before any installation work begins.
