question: How long does express prior consent last when I request a VEU quote?
answer: Under the Essential Services Commission's telemarketing and doorknocking rules, express prior consent given through an online enquiry form lasts for three months unless you withdraw it earlier or explicitly agree to a different timeframe, and you choose which contact channels (phone, email, or home visit) apply—see [VEU scams, cold calls, and doorknocking bans](/victoria/veu-scams-cold-calls/).
