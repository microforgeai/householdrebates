question: Do I have to know which VEU accredited provider is creating my certificates?
answer: Yes. A licensed plumber or electrician installs the equipment, while an Essential Services Commission accredited person creates the certificates that fund your discount. Under the Essential Services Commission's lead generation and marketing rules, you must be told the name of the accredited person creating the certificates for your upgrade—see [how to find and check a VEU accredited provider](/victoria/find-an-accredited-provider/).
