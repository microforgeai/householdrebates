question: What should I check in a written VEU quote before any work begins?
answer: Before allowing any removal or installation work to start, check that your written quote names the VEU-approved product model, confirms at least a five-year household warranty on heating or hot water units, names the accredited provider creating the certificates, and itemises both the point-of-sale VEU discount and [your mandatory minimum co-payment](/victoria/veu-minimum-co-payment/).
