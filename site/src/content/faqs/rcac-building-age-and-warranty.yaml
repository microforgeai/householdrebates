question: How old must my home be, and what warranty is required for a VEU air conditioner discount?
answer: Energy Victoria's household rules state that when replacing an existing heating system, your building must be more than two years old, and the new reverse-cycle air conditioner must be on the VEU Register of Products with a minimum five-year household warranty. Homes under two years old cannot claim a heater-replacement scenario—see [all-electric new homes and VEU rules](/victoria/new-homes-all-electric-2027/).
