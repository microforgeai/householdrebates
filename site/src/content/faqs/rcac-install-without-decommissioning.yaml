question: Can I get a VEU air conditioner discount without removing an existing heater?
answer: Yes, Energy Victoria lists separate household scenarios for installing an approved split system or ducted reverse-cycle air conditioner without decommissioning an existing heater, though the indicative discount is much smaller than when decommissioning a room gas or ducted gas heater—compare [the room and ducted tables above](/victoria/air-conditioner-rebate/#household-split-and-multi-split-discount-scenarios).
