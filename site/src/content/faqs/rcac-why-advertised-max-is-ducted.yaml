question: Why doesn't the largest advertised VEU air conditioning discount apply to a single split system?
answer: On Energy Victoria's household heating and cooling table, the upper headline figure applies only when decommissioning a whole-home ducted gas heater and installing a large 22.4 kW ducted reverse-cycle system. Replacing a single room gas heater with a 3 to 9 kW split system—see our [gas room heater to split-system guide](/victoria/gas-room-heater-to-split-system/)—creates fewer certificates and sits in a lower discount range.
