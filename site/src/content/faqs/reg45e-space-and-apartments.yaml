question: "What if my home or apartment has no suitable space or uses centralised gas hot water?"
answer: "Under regulation 45E(3), exemptions apply where there is insufficient indoor space or no suitable outdoor space for an electric water heater, or where a Class 2 apartment building or swimming pool is served by a centralised gas hot water system."
