question: "Is there an exemption if an electric water heater requires a main switchboard or network upgrade?"
answer: "Yes. Regulation 45E(3) includes exemptions where installing an electric water heater would require altering the main switchboard or a distribution board, or augmenting the electricity distribution network beyond a basic or standard connection."
