question: "Who decides whether a 2027 gas hot water exemption applies to my property?"
answer: "Your licensed plumber assesses your property against regulation 45E and carries the statutory obligation (with a penalty of 20 penalty units for a breach). Our guide is a plain-English summary of the regulation text, not legal advice."
