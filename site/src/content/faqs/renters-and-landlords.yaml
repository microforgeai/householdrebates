question: "Are rental properties eligible for Victorian Energy Upgrades discounts?"
answer: "Yes, rental properties in Victoria can access VEU discounts for approved reverse-cycle air conditioners and hot water upgrades, provided the building is more than two years old when replacing an existing system. Renters must have the landlord's approval before any heating, cooling, or hot water installation takes place. From 1 March 2027, new rental minimum efficiency standards also apply when systems fail or at the start of a new lease."
