question: Are rental properties eligible for Victorian Energy Upgrades discounts?
answer: Yes. Private rental properties in Victoria can access VEU discounts for approved reverse-cycle air conditioners, hot water systems, ceiling insulation, and weather sealing, provided the building is more than two years old when replacing an existing appliance and the landlord approves before work starts. Unlike VEU, Solar Victoria's standalone Solar Homes hot water rebate is generally limited to owner-occupiers (outside Solstice gas-shutdown towns). Under currently legislated rules from 1 March 2027, minimum efficiency standards also apply when rental systems fail or at a new lease—see [Victorian landlord 2027 rental standards](/victoria/landlords-rental-standards-2027/).
