question: What energy-saving changes can a Victorian renter make without
  landlord permission?
answer: Consumer Affairs Victoria states that renters can install
  energy-efficient LED light globes that need no new light fittings, low-flow
  showerheads provided they keep and reinstall the original showerhead later,
  and non-permanent window film without asking permission first. Any hard-wired
  heating, cooling, hot water, or ceiling insulation upgrade requires working
  with your rental provider before booking an accredited provider.
