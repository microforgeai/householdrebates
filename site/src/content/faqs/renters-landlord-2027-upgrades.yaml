question: What must Victorian rental providers upgrade from 1 March 2027?
answer: Under currently legislated rules from 1 March 2027, Victorian minimum rental energy efficiency standards introduce requirements for ceiling insulation and 4-star WELS showerheads at a new lease, main living area cooling at a new lease, and efficient electric replacements when an existing hot water unit or main living area heater fails beyond repair. Currently legislated draught-proofing requirements start from 1 July 2027, and cooling extends to all rentals from 1 July 2030, subject to narrow exemptions—see [Victorian landlord 2027 rental energy efficiency standards](/victoria/landlords-rental-standards-2027/).
