question: Do Victorian renters need their landlord’s permission for a VEU upgrade?
answer: Renters are eligible for Victorian Energy Upgrades discounts, and Energy
  Victoria advises checking with your rental provider first because written
  permission is required for fixture or appliance changes. Private rental
  properties can access VEU heating, cooling, hot water, and insulation
  discounts when tenants and landlords coordinate before work starts. Under
  Consumer Affairs Victoria rules, draught proofing is treated as a reasonable
  change a rental provider cannot refuse without good reason in a home with no
  gas appliances, while properties with gas appliances need a gas safety check
  first.
