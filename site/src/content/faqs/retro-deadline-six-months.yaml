question: "What is the strict deadline for processing a retrospective VEU discount?"
answer: "Energy Victoria states that any retrospective claim must be processed by an accredited provider within six months of the end of the calendar year in which the upgrade took place (for example, a December 2025 upgrade had to be processed by 30 June 2026)."
