question: "Can I claim a Victorian Energy Upgrades discount after my system is already installed?"
answer: "Generally no. Energy Victoria advises that you must contact an accredited provider (or use an installer working with one) before buying or installing your system. Retrospective discounts after installation work has started are typically not possible. See our guide on /victoria/reverse-cycle-vs-gas-heater/ for how the timing rule works."
