question: Can I claim a Victorian Energy Upgrades discount after my system is already installed?
answer: Generally no. Energy Victoria advises that you must contact an accredited provider (or use an installer working with one) before buying or installing your system—see [how VEU quotes work](/how-quotes-work/). Retrospective discounts after installation work has started are possible only in very limited cases within the strict calendar-year deadline explained above.
