question: "Do I have to remove my old gas wall or room heater to get the higher VEU discount?"
answer: "Yes. To access the room gas heater replacement range, the existing fixed gas room heater must be formally decommissioned after pre-installation evidence is collected by an accredited provider in a home more than two years old. Installing a split system without decommissioning an existing heater receives a much smaller VEU discount."
