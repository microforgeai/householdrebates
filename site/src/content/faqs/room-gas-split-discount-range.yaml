question: Why is the VEU discount for replacing a gas room heater shown as a range?
answer: The certificate count for a single split system replacing a non-ducted room gas heater varies with the heating and cooling efficiency rating and capacity of the new unit (from 3 kW to 9 kW), your postcode climate zone, and the accredited provider's current certificate pricing. See the published range in the discount table above.
