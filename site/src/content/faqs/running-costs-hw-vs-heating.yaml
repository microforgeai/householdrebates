question: Does switching gas heating or gas hot water save more each year in Victoria?
answer: Energy Victoria’s published estimates show larger annual savings from
  replacing whole-home ducted gas heating with ducted reverse-cycle air
  conditioning than from replacing a single room gas heater or gas hot water
  system alone. Upgrading hot water and heating together—and disconnecting your
  last gas appliance to stop daily supply charges—delivers the largest combined
  bill reduction; compare each published scenario in the picker above.
