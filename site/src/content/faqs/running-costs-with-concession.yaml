question: How do Victorian energy concessions affect switching from gas to electric?
answer: Eligible Pensioner Concession Card, Health Care Card, and DVA Gold Card holders receive the year-round Annual Electricity Concession on electricity usage and service charges above the annual threshold, whereas the Winter Gas Concession applies only from 1 May to 31 October. Read the full breakdown in [energy rebates for concession card holders in Victoria](/victoria/concession-card-holders/).
