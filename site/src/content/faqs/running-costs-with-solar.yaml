question: How does rooftop solar affect annual electric running-cost savings?
answer: Energy Victoria publishes separate all-electric estimates for existing
  Victorian homes with and without rooftop solar PV, showing higher yearly
  savings when heat pumps and reverse-cycle air conditioners run during sunny
  daytime hours. Many heat pump water heaters include timers so water heating
  occurs when rooftop solar generation peaks.
