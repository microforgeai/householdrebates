question: How does Shepparton's climate affect heating and cooling upgrades?
answer: Central Shepparton sits in National Construction Code climate zone 4 (hot
  dry summer, cool winter), unlike metropolitan Melbourne's zone 6. Reverse-cycle
  split systems and ceiling insulation address both summer cooling demand and
  frosty Goulburn Valley winter mornings, and rental minimum cooling rules also
  apply from March 2027 as currently legislated.
