question: Can Greater Shepparton residents access Goulburn Murray Solar Savers?
answer: Yes. According to the Goulburn Murray Climate Alliance (GMCA), Goulburn
  Murray Solar Savers connects households across Greater Shepparton and six other
  participating GMCA councils with vetted providers for solar, batteries, heat
  pump hot water, split systems, ceiling insulation, draught proofing, and home
  energy assessments.
