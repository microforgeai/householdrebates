question: What should households in cooler Victorian regions check when sizing a
  heat pump?
answer: In cooler climates—such as Victorian postcodes in VEU heat pump climatic
  zone 5—Energy Victoria advises considering a heat pump model with frost
  protection, and the consumer factsheet notes electric booster elements can
  help maintain recovery in cold conditions. Enter your postcode in the lookup
  above to check whether your area sits in zone 4 or zone 5.
