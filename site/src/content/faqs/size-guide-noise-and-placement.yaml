question: How noisy is a heat pump hot water system and where should it sit?
answer: Energy Victoria’s water heating consumer factsheet states that
  air-source heat pumps produce operating noise comparable to an outdoor
  air-conditioner compressor while actively heating water. Ask your plumber to
  position the unit in a well-ventilated outdoor spot away from bedroom windows
  and neighbour boundary fences.
