question: Does running a heat pump on a daytime solar timer change the tank size I need?
answer: Energy Victoria’s water heating consumer factsheet notes that setting a
  timer to heat water mainly during daytime solar hours can require a slightly
  larger storage tank so your household has enough stored hot water overnight
  and the next morning. Discuss your household’s morning and evening shower
  routine with your plumber before choosing a tank capacity.
