question: Do I need Solar Victoria pre-approval before solar panels are installed?
answer: Yes. Under Solar Homes rules, your authorised solar retailer must upload a quote to the Solar Victoria portal and you must receive formal eligibility confirmation before any installation work starts. Installing panels before pre-approval makes the system ineligible for both the Solar Homes rebate and the matching interest-free loan.
