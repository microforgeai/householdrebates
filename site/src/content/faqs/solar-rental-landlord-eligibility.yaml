question: Can landlords claim the Solar Homes solar panel rebate on a Victorian rental property?
answer: Yes, Solar Victoria offers solar panel rebates for eligible Victorian rental properties, and the same combined household taxable income cap applies to rental applications from 1 July 2026. Check Solar Victoria's rental solar panel guidance for current landlord and tenant application steps, and see our [renters and landlords guide](/victoria/renters/) for how VEU upgrades work on rentals.
