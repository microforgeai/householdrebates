question: Can I get a Solar Homes panel rebate if my house already has old solar panels?
answer: Solar Victoria only allows a replacement or expansion rebate when the existing solar PV system was installed more than ten years ago and no prior Solar Homes solar panel or battery rebate has been claimed by your household at that address. Check [how VEU and Solar Homes differ](/victoria/veu-vs-solar-homes/) if you are also planning hot water or heating upgrades.
