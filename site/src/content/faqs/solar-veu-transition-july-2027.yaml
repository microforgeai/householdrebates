question: Should I wait until residential solar panels move into VEU on 1 July 2027?
answer: Solar Victoria states that existing Solar Homes rooftop solar rebates and optional interest-free loans continue under current eligibility rules until 30 June 2027, before transitioning into Victorian Energy Upgrades from 1 July 2027. Detailed VEU certificate rates and co-payment settings from July 2027 have not yet been published, so households eligible for Solar Homes today can compare current quotes now rather than guessing future certificate prices.
