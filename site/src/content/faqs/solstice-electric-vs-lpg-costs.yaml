question: How do electric running costs compare with bottled LPG for Solstice towns?
answer: In a Marong household study published by the City of Greater Bendigo for
  Solstice-impacted customers, bottled LPG running costs were estimated at least
  2.5 times higher than a partly or fully electric home. Read the council’s
  Solstice support page linked below for the full study assumptions.
