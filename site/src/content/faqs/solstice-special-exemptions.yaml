question: What special Solar Victoria exemptions apply to impacted Solstice gas
  customers?
answer: Impacted Solstice Energy customers are exempt from the standard Solar
  Homes household income cap, can replace a gas hot water system of any age,
  include eligible rental providers, and can access a Solar Victoria top-up
  where a newer home or recent appliance does not meet standard VEU criteria.
  Solar Victoria also notes that eight VEU accredited providers confirmed
  availability across the ten towns.
