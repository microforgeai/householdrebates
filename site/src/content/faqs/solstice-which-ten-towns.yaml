question: Which 10 Victorian towns are affected by the Solstice compressed
  natural gas shutdown?
answer: "Solar Victoria lists ten regional towns whose Solstice Energy
  compressed natural gas networks are closing by mid-to-late 2026: Marong (3515)
  and Heathcote (3523) in Greater Bendigo, Swan Hill (3585) and Robinvale (3549)
  in Swan Hill, Maldon (3463) in Mount Alexander, Kerang (3579) in Gannawarra,
  Nathalia (3638) in Moira, Terang (3264) in Corangamite, and Lakes Entrance
  (3909) and Orbost (3888) in East Gippsland."
