question: "Why does Energy Victoria recommend a home visit before sizing a split system?"
answer: "Energy Victoria's buyers guide recommends having an installer inspect your room size, ceiling height, windows, and insulation first because a split system that is too large uses more energy than needed, while an undersized unit struggles in peak winter or summer. You should also compare outdoor unit noise ratings before choosing a placement."
