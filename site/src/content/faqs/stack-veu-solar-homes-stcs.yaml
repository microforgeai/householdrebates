question: Can I combine the VEU hot water discount, the Solar Homes rebate, and Federal STCs?
answer: Yes, where you meet each program's rules. Eligible heat pumps under 425 litres on the Clean Energy Regulator register can receive Federal Small-scale Technology Certificates (STCs) alongside Victorian Energy Upgrades VEECs, and Solar Victoria calculates the Solar Homes hot water rebate on the remaining out-of-pocket price after STCs and VEECs are deducted. See the combined examples in the stacking breakdown above.
