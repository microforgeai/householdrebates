question: What if I already bought a reverse-cycle air conditioner at a retail store?
answer: If you bought a VEU-approved unit at a retail sale but have not started installing it or removing your old heater, pause and contact a [VEU accredited provider](/victoria/find-an-accredited-provider/) before booking any installation work. Once installation or heater removal starts without an accredited provider involved, [a retrospective VEU discount](/victoria/already-installed-retrospective-discount/) is rarely available.
