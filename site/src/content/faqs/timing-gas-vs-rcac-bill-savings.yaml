question: Does switching from a gas heater to reverse-cycle air conditioning lower yearly energy bills?
answer: Yes. Energy Victoria publishes separate indicative annual bill savings for replacing a room gas heater with a split-system air conditioner and for replacing ducted gas heating with a ducted reverse-cycle system—check [the running cost comparison above](/victoria/reverse-cycle-vs-gas-heater/#running-cost-comparison-reverse-cycle-vs-gas-heating) or compare scenarios in our [gas vs heat pump running costs calculator](/victoria/gas-vs-heat-pump-running-costs/).
