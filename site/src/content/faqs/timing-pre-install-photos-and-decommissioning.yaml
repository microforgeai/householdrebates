question: Why must an accredited provider inspect or photograph my old gas heater before it is removed?
answer: To claim a heater-replacement scenario rather than the much smaller no-decommission scenario, the accredited provider must collect geo-tagged pre-installation photographs, serial numbers, and decommissioning declarations while your old gas or fixed electric heater is still in place—compare [the decommissioning table above](/victoria/reverse-cycle-vs-gas-heater/#decommissioning-vs-installing-without-decommissioning).
