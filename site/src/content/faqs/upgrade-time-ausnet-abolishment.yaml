question: "How long does gas meter removal or service abolishment take once I leave mains gas?"
answer: "Timeframes vary by gas distributor and are arranged through your gas retailer: on AusNet's network, meter removal takes around two business days while full service cut-and-cap abolishment takes up to 15 business days."
