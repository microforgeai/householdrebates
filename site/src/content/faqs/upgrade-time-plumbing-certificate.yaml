question: "How soon after installation must my plumber issue a plumbing compliance certificate?"
answer: "According to the Building and Plumbing Commission, a licensed plumber must issue a plumbing compliance certificate within five days of completing any Type A gas appliance work or plumbing work above the statutory value threshold."
