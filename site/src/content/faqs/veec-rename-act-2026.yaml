question: "Are VEECs being renamed under the 2026 legislation changes?"
answer: "Yes. Under Act No. 37/2026, on proclamation the Victorian Energy Efficiency Target Act will be renamed the Victorian Energy Upgrades Target Act and VEECs will be renamed energy upgrade certificates."
