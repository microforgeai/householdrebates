question: "Where do I report a suspected VEU cold call, doorknock, or misleading offer?"
answer: "Contact the accredited provider first (providers must acknowledge complaints within five business days and aim to resolve them within 20 business days), or report non-compliance to the Essential Services Commission, Consumer Affairs Victoria, or the Australian Do Not Call Register using the official numbers listed on /victoria/veu-scams-cold-calls/."
