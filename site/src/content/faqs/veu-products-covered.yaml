question: "Which home upgrades does the Victorian Energy Upgrades program cover?"
answer: "Energy Victoria lists household VEU discounts across heating and cooling, hot water systems, induction cooktops, ceiling insulation, clothes dryers, window glazing, weather sealing, efficient showerheads, fridges and freezers, in-home displays, and televisions. Each product category has its own eligibility rules and approved product register."
