question: Does VEU have an income test like the Solar Homes program?
answer: No. Energy Victoria's household product pages state that all Victorian households are eligible for VEU discounts without a household income cap or property value cap, whereas Solar Homes hot water and solar panel rebates enforce both an income cap (reduced on 1 July 2026) and a property value cap. Check the exact caps in the comparison table above.
