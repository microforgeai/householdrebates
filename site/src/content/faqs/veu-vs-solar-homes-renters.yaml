question: "Can renters access both VEU discounts and Solar Homes hot water rebates?"
answer: "Private renters can access VEU discounts across heating, cooling, hot water, and other activities with their landlord's permission where required, whereas the standard Solar Homes hot water rebate is limited to owner-occupiers."
