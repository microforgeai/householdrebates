question: "Who runs Victorian Energy Upgrades versus the Solar Homes program?"
answer: "Victorian Energy Upgrades is regulated by the Essential Services Commission with policy set by Energy Victoria (DEECA) and delivered through accredited providers, whereas the Solar Homes program is administered directly by Solar Victoria with a formal pre-approval application."
