question: Who can book a free home energy assessment in the City of Whittlesea?
answer: Under the council-backed City of Whittlesea Home Energy Program,
  eligible properties can book one free home energy assessment until June 2027
  or until program funds run out, provided the property has not received an
  assessment in the past five years.
