question: What is the City of Whittlesea’s community emissions target?
answer: In launching its Home Energy Program in October 2026 alongside community
  events, speed-date expert sessions, and a Home Energy Expo, the City of
  Whittlesea highlighted its municipal target of net zero community emissions by
  2036.
