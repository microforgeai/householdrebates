question: "Why does the air conditioner discount vary so much between homes?"
answer: "The Victorian Energy Upgrades discount is calculated from the greenhouse gas savings of your specific upgrade. Replacing a whole-home ducted gas heater with a high-capacity ducted reverse-cycle system creates far more certificates than replacing a single room gas heater or installing a split system without decommissioning an existing heater. Compare the full scenario tables on /victoria/air-conditioner-rebate/."
