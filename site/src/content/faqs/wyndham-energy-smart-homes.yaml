question: What does Wyndham City’s Energy Smart Homes program include?
answer: Wyndham City’s Energy Smart Homes program provides recorded
  electrification workshops, a downloadable Your Go Electric Plan resource, and
  links to Western Alliance for Greenhouse Action webinars. Residents can access
  these council resources alongside state-wide VEU and Solar Homes incentives.
