question: Is energy help available in Punjabi and other community languages in
  Wyndham, and do new estates qualify for VEU?
answer: Through the Western Alliance for Greenhouse Action, interpreted Home
  Energy in Your Language webinars cover Arabic, Mandarin, Cantonese,
  Vietnamese, Sgaw Karen, and Punjabi for residents across six western councils
  including Wyndham. Note that in newer Werribee, Point Cook, and Tarneit
  estates, most VEU heating and hot water replacement discounts require your
  home to be more than two years old.
